<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meeple Things | Payment Upload</title>
<style>
  body{font-family:Arial,sans-serif;background:#FAF9F5;color:#34343A;margin:0;padding:16px}
  .card{max-width:480px;margin:40px auto;background:#fff;padding:24px;border-radius:14px;border:1px solid #DCEBED;border-top:4px solid #E5B63F;text-align:center}
  h2{color:#145565;margin:0 0 12px}
  a.btn{display:block;margin-top:18px;padding:14px;background:#145565;color:#FAF9F5;border-radius:9px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <h2>🎲 Meeple Things 3D Printing</h2>
  <p id="m">Opening your payment upload form…</p>
  <a class="btn" id="go" href="#" style="display:none">Continue to upload form</a>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var s=q.get('s')||'', id=q.get('id')||'', pt=q.get('pt')||'';
  var m=document.getElementById('m'), go=document.getElementById('go');
  // Only forward to Apps Script web apps, and only with safe ID characters.
  if(!/^[A-Za-z0-9_-]{20,}$/.test(s)){ m.textContent='This payment link is not valid. Please contact Meeple Things.'; return; }
  var url='https://script.google.com/macros/s/'+s+'/exec?action=pay&id='+encodeURIComponent(id)+'&pt='+encodeURIComponent(pt);
  go.href=url; go.style.display='block';
  setTimeout(function(){ location.replace(url); }, 150);
})();
</script>
</body>
</html>
